{% macro nav_items(items) %}
    {% for item in items %}
        {% if loop.changed(item.category) and item.category %}
            <h2 class="small fw-semibold text-body-secondary px-1 py-1 mb-0">{{ item.category|capfirst }}</h2>
        {% endif %}
        {% if item.is_action %}
            <li class="nav-item">
                <form method="post"
                      action="{{ url_for(item.endpoint) }}"
                      {% if item.confirm %}onsubmit="return confirm('{{ item.confirm }}')"{% endif %}>
                    <button class="nav-link text-start w-100 border-0 d-flex gap-2 align-items-center"
                            type="submit">
                        {% if item.icon %}<i class="bi {{ item.icon }}"></i>{% endif %}
                        {{ item.label|capfirst }}
                    </button>
                </form>
            </li>
        {% else %}
            <li class="nav-item">
                <a class="nav-link {{ 'active' if item.active }} d-flex gap-2 align-items-center"
                   href="{{ url_for(item.endpoint) }}">
                    {% if item.icon %}<i class="bi {{ item.icon }}"></i>{% endif %}
                    {{ item.label|capfirst }}
                </a>
            </li>
        {% endif %}
    {% endfor %}
{% endmacro %}
