<div class="mb-3 d-flex justify-content-end gap-2">
    {% if tab_ctx.preview_url %}
        <button class="btn btn-primary d-flex gap-2 align-items-center"
                type="submit"
                form="{{ tab.form_id }}-preview">
            <i class="bi bi-eye"></i>
            Preview
        </button>
    {% endif %}
    <button class="btn btn-warning d-flex gap-2 align-items-center"
            type="submit"
            form="{{ tab.form_id }}">
        <i class="bi bi-floppy-fill"></i>
        Save changes
    </button>
</div>
<form id="{{ tab.form_id }}"
      method="post"
      action="{{ view.url('tab', id_=obj.id, tab_key=tab.key) }}"
      data-content-form>
    <input type="hidden" name="content">
</form>
{% if tab_ctx.preview_url %}
    <form id="{{ tab.form_id }}-preview"
          method="post"
          action="{{ tab_ctx.preview_url }}"
          target="content-preview"
          data-content-form>
        <input type="hidden" name="content">
    </form>
{% endif %}
<div class="bg-body-tertiary rounded-2 px-3 py-4">
    <div class="bg-body rounded-2 mx-auto"
         data-content-editor='{{ tab_ctx.editor|tojson }}'></div>
</div>
