{% from "admin/_engine/_macros.html" import save_button %}

<div class="mb-3 d-flex flex-wrap justify-content-end gap-2">
    {% if tab_ctx.preview_url %}
        <button class="btn btn-sm btn-outline-secondary d-flex gap-2 align-items-center"
                type="submit"
                form="{{ tab.form_id }}-preview">
            <i class="bi bi-eye"></i>
            Preview
        </button>
    {% endif %}
    {{ save_button(tab.form_id) }}
</div>
<form id="{{ tab.form_id }}"
      method="post"
      action="{{ view.url('tab', id_=obj.id, tab_key=tab.key) }}"
      data-content-form>
    <input type="hidden" name="content">
</form>
{% if tab_ctx.preview_url %}
    <form id="{{ tab.form_id }}-preview"
          method="post"
          action="{{ tab_ctx.preview_url }}"
          target="content-preview"
          data-content-form>
        <input type="hidden" name="content">
    </form>
{% endif %}
<div class="bg-body-tertiary rounded-2 px-3 py-4">
    <div class="bg-body rounded-2 mx-auto"
         data-content-editor='{{ tab_ctx.editor|tojson }}'></div>
</div>
